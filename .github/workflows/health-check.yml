name: Production Health Check

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    name: Check production availability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required URLs
        run: |
          missing=0
          if [ -z "$PRODUCTION_HEALTH_URL" ]; then
            echo "::error::Set the PRODUCTION_HEALTH_URL repository secret, for example https://bakevault.com.ng/health.json"
            missing=1
          fi
          if [ -z "$SUPABASE_HEALTH_URL" ]; then
            echo "::error::Set the SUPABASE_HEALTH_URL repository secret, for example https://PROJECT.supabase.co/functions/v1/health-check"
            missing=1
          fi
          exit "$missing"
        env:
          PRODUCTION_HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
          SUPABASE_HEALTH_URL: ${{ secrets.SUPABASE_HEALTH_URL }}

      - name: Check Vercel static health endpoint
        run: curl --fail --silent --show-error --max-redirects 0 --retry 3 --retry-delay 10 --max-time 20 "$PRODUCTION_HEALTH_URL"
        env:
          PRODUCTION_HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}

      - name: Check Supabase backend health endpoint
        run: curl --fail --silent --show-error --max-redirects 0 --retry 3 --retry-delay 10 --max-time 20 "$SUPABASE_HEALTH_URL"
        env:
          SUPABASE_HEALTH_URL: ${{ secrets.SUPABASE_HEALTH_URL }}
